<html>

<head>
    <title>clock</title>
    <link rel="icon" type="image/png" href="clock.png" style="border-radius: 50%;">

    <style>
        body {
            background: #000000;
        }
        #clock {
            font-family: 'Helvetica', sans-serif;
            color: #ffffff;
            font-size: 128px;
            text-align: center;
            margin-top: 20%;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50vh;
        }
    </style>



</head>

<body>
    <div class="container">
        <div id="clock"></div>
    </div>
    <script>
        function updateClock() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>

<div id="clock">
    <style>
        #clock {
            font-family: 'Helvetica', sans-serif;
            color: #d1d5ff;
            font-size: 167px;
            text-align: center;
            margin-top: 20%;
        }
    </style>
</div>
</body>

</html>
